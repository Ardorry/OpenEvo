policy:
  name: "public-metadata-stratified-freeze-v1"
  immutable: true
  target_ratio: "11_dev_to_6_validation"
  decision_inputs:
    - "task_id"
    - "domain inferred from the task_id prefix"
    - "data paths, types, and descriptions in task_info.json"
    - "candidate-visible data and related_work byte sizes"
    - "estimated dependency complexity from the public task description and file formats"
  forbidden_inputs:
    - "target_study/checklist.json"
    - "target_study paper or images"
    - "scorer or judge output"
    - "leaderboard task scores"
  constraints:
    - "Official GitHub base tasks are test-only and never enter community Dev or Validation."
    - "Earth, Information, and Life each appear on both sides."
    - "A one-task domain is assigned to exactly one side, so cross-split coverage for that domain is impossible."
    - "The split must never be changed in response to later scores."
  selection_method: >-
    One-time manual constrained stratification. First split every multi-task domain across
    both sides; then balance file modalities, candidate-visible bytes, and estimated
    dependency complexity while fixing exactly 11 Dev and 6 Validation tasks. Ties were
    resolved by stable task_id order, without target_study or score access.
  coverage_limitations:
    - "Astronomy, Chemistry, Energy, Material, Math, Neuroscience, and Physics have one community task each and therefore cannot cover both sides."
    - "Dev contains the only Astronomy, Chemistry, Energy, Material, and Neuroscience tasks."
    - "Validation contains the only Math and Physics tasks."
    - "Dev has 630646111 candidate-visible bytes; Validation has 293612695 candidate-visible bytes."
