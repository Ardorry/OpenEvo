[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openevo-chembench"
version = "0.1.0"
description = "Security-isolated ChemBench evolution automation for OpenEvo."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "datasets>=2.19.0",
    "httpx>=0.27.0",
    "matplotlib>=3.8.0",
    "openevo==0.1.8",
    "pyyaml>=6.0",
    "socksio>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.8.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["openevo_chembench*"]

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 99
target-version = "py311"
