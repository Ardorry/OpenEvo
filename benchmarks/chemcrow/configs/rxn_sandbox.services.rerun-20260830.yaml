name: chemcrow-rxn-sandbox-rerun-20260830

services:
  redis:
    image: sha256:691577adaf11927f4bb8871d40a5dd69a5c300d4453b742e8f6383c3e6e8d2e1
    command: ["redis-server", "--requirepass", "ubuntu"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "ubuntu", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  broker:
    image: sha256:e582c0bc7766f3342496d8485efb5a1df782b5ce3886ad017e2eaae442311f69
    environment:
      RABBITMQ_DEFAULT_USER: ubuntu
      RABBITMQ_DEFAULT_PASS: ubuntu
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20

  worker:
    image: sha256:c1c8b4d19b37494d4786f8d3e998f5ad5aa4b9dfa2fa4040daad44bfc89ad2a2
    environment:
      CELERY_QUEUE: product_prediction,retro_prediction
      CELERY_BROKER_URL: amqp://ubuntu:ubuntu@broker:5672//
      CELERY_RESULT_BACKEND: redis://:ubuntu@redis:6379/0
      CELERY_CONCURRENCY: "1"
      CELERY_MAX_TASKS_PER_CHILD: "1"
      RXN_LOG_LEVEL: info
      RXN_TORCH_NUM_THREADS: "2"
    volumes:
      - /home/lhy-h/work/chemcrowrun/repro-deps/sources/rxn-sandbox/models:/app/models:ro
      - /home/lhy-h/work/chemcrowrun/repro-deps/sources/rxn-sandbox/vocab:/app/vocab:ro
      - /home/lhy-h/work/chemcrowrun/repro-deps/sources/rxn-sandbox/scripts:/app/scripts:ro
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      broker:
        condition: service_healthy
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  mcp:
    image: sha256:bbdb42299fd30aea5f0ffac815874c9333f9fae18e7cce8b4457b2a29ad5536e
    environment:
      CELERY_BROKER_URL: amqp://ubuntu:ubuntu@broker:5672//
      CELERY_RESULT_BACKEND: redis://:ubuntu@redis:6379/0
    ports:
      - 127.0.0.1:8300:8000
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      broker:
        condition: service_healthy
      worker:
        condition: service_started
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
