schema_version: chemcrow_experiment_v1
experiment_id: chemcrow-task-local-preflight-v1
task_manifest: ../tasks.jsonl
task_ids:
  - chemcrow-03
  - chemcrow-06
  - chemcrow-12
feedback_mode: F2
artifact_type: text_memory
run_root: ../../../../runs/preflight-v1
cache_root: ../../../../caches/preflight-v1
ledger_root: ../../../../runs/preflight-v1/claims
controlled_chemicals_csv: ../../../../vendor/chemcrow-public/chemcrow/data/chem_wep_smi.csv
network_enabled: true
rollout_base_url: ${OPENEVO_ROLLOUT_BASE_URL}
candidate:
  timeout_seconds: 900
  runtime:
    backend: docker
    profile: managed_science
    container_user: host
    image: HUMAN_ACTION_REQUIRED_IMMUTABLE_RUNTIME_IMAGE
    prepare: []
    env: {}
    network: host
    workdir: /workspace
    gpus: 0
    allow_internet: true
    import_path: null
    kwargs: {}
  agent:
    harness: codex
    import_path: null
    model_name: ${OPENEVO_CANDIDATE_MODEL}
    settings:
      auth_mode: subscription
      temperature: 0.0
      max_iterations: 40
    env: {}
    mcp_servers: []
    skills_path: null
    custom_shell: null
  builder:
    strategy: agent_transcript
    config: {}
  metadata:
    policy_version: chemcrow-task-local-v1
    rollout_step: 0
reflector:
  provider: codex_cli
  model: ${OPENEVO_REFLECTOR_MODEL}
  temperature: 0.2
  timeout_seconds: 900
evolution_evaluator:
  timeout_seconds: 600
  runtime: null
  agent:
    harness: codex
    import_path: null
    model_name: ${OPENEVO_EVOLUTION_EVALUATOR_MODEL}
    settings:
      auth_mode: subscription
      temperature: 0.0
    env: {}
    mcp_servers: []
    skills_path: null
    custom_shell: null
  builder:
    strategy: agent_transcript
    config: {}
  metadata:
    policy_version: chemcrow-evolution-evaluator-v1
final_evaluator:
  timeout_seconds: 600
  runtime: null
  agent:
    harness: codex
    import_path: null
    model_name: ${OPENEVO_FINAL_EVALUATOR_MODEL}
    settings:
      auth_mode: subscription
      temperature: 0.0
    env: {}
    mcp_servers: []
    skills_path: null
    custom_shell: null
  builder:
    strategy: agent_transcript
    config: {}
  metadata:
    policy_version: chemcrow-final-evaluator-v1
